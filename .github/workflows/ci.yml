name: Verificar AcheDoacoes
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar banco de testes
        run: npm run setup
      - name: Testar backend
        run: npm test
      - name: Compilar frontend e backend
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ache
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ache:ci-only-password@localhost:5432/ache_test
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:deploy:vercel
      - run: npm run db:seed
      - run: npm test
      - run: npm run build:vercel
